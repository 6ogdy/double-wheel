<title>Double Wheel Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the game fills the window at 16:9 (native 1920 x 1080, scaled). A small two-option switch floats over the top edge so the client can flip between the two stone wheels. Single dark look: the page is only a frame for the game. */
:root {
  --bg: #070b08;
  --panel: rgba(9, 14, 10, .82);
  --line: rgba(247, 195, 40, .28);
  --fg: #f3ead2;
  --fg-dim: #b9ae8c;
  --accent: #f7c328;
  --accent-ink: #1a1203;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: grid; place-items: center; overflow: hidden;
}
#stage { position: relative; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; overflow: hidden; background: var(--bg); }
#game { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; }

#switch {
  position: absolute; z-index: 2; top: max(8px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 4px; padding: 4px; max-width: calc(100% - 16px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
#switch button {
  min-height: 44px; min-width: 0; padding: 6px 16px; border: 0; border-radius: 8px; cursor: pointer;
  background: transparent; color: var(--fg-dim); font: inherit; text-align: left;
  display: grid; gap: 2px; align-content: center;
}
#switch button b { font-size: 14px; font-weight: 650; letter-spacing: .01em; color: var(--fg); }
#switch button span { font-size: 12px; color: var(--fg-dim); white-space: nowrap; }
#switch button[aria-pressed="true"] { background: var(--accent); }
#switch button[aria-pressed="true"] b, #switch button[aria-pressed="true"] span { color: var(--accent-ink); }
#switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#switch button:hover:not([aria-pressed="true"]) { background: rgba(255, 255, 255, .07); }
@media (max-width: 640px) { #switch button { flex: 1 1 0; padding: 6px 8px; } #switch button span { font-size: 11px; white-space: normal; } }
</style>

<div id="stage">
  <iframe id="game" src="game-v4/index.html" title="Double Wheel" allow="autoplay"></iframe>
</div>

<script>
(function () {
  var stage = document.getElementById("stage"), game = document.getElementById("game");
  function fit() { game.style.transform = "scale(" + (stage.clientWidth / 1920) + ")"; }
  fit(); window.addEventListener("resize", fit);
})();
</script>
